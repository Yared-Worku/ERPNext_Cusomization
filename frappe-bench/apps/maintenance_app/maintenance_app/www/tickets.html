{% extends "templates/web.html" %}

{% block page_content %}
<div class="container my-5">
    <h2 class="mb-4 text-primary">🛠️ Maintenance Service Tickets Portal</h2>

    <!-- Section 1: Create Ticket Form -->
    <div class="card mb-5 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Create New Service Ticket</h5>
        </div>
        <div class="card-body">
            <form id="create-ticket-form">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Equipment Name</label>
                    <input type="text" id="equipment_name" class="form-control" placeholder="e.g. Hydraulic Pump #2" required>
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-bold">Labor Fee ($)</label>
                    <input type="number" step="0.01" id="labor_fee" class="form-control" value="0.00" required>
                </div>

                <h6 class="mt-4 font-weight-bold">Spare Parts</h6>
                <div id="spare-parts-list">
                    <div class="row g-2 mb-2 part-row">
                        <div class="col-md-5">
                            <input type="text" class="form-control part-name" placeholder="Part Name" required>
                        </div>
                        <div class="col-md-3">
                            <input type="number" class="form-control part-qty" placeholder="Qty" value="1" min="1" required>
                        </div>
                        <div class="col-md-4">
                            <input type="number" step="0.01" class="form-control part-price" placeholder="Unit Price ($)" value="0.00" required>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn btn-outline-secondary btn-sm mb-3" onclick="addSparePartRow()">
                    + Add Another Part
                </button>

                <hr>

                <button type="submit" class="btn btn-success">
                    Submit Ticket
                </button>
            </form>
        </div>
    </div>

    <!-- Section 2: Tickets Table -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Existing Tickets</h5>
            <button class="btn btn-sm btn-light" onclick="fetchTickets()">🔄 Refresh</button>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="tickets-table">
                    <thead class="table-light">
                        <tr>
                            <th>Ticket ID</th>
                            <th>Equipment</th>
                            <th>Status</th>
                            <th>Labor Fee</th>
                            <th>Total Cost</th>
                            <th>Spare Parts</th>
                        </tr>
                    </thead>
                    <tbody id="tickets-tbody">
                        <tr>
                            <td colspan="6" class="text-center py-4">Loading tickets...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="/assets/maintenance_app/js/tickets.js"></script>
{% endblock %}
